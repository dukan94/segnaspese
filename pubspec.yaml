name: finance_app
description: >
  App per la gestione delle finanze personali - locale, offline-first,
  con sync multi-dispositivo su Turso (piano Free) e OCR scontrini offline.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Database locale
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Sync multi-dispositivo (Turso) - piano Free
  # NOTA: si usa l'API HTTP di Turso (Hrana-over-HTTP, endpoint /v2/pipeline)
  # tramite il pacchetto `http` puro Dart, invece del client nativo
  # `libsql_dart` (richiederebbe un toolchain Rust/cargo non installato su
  # questa macchina per compilare codice nativo a ogni build). Vedi
  # data/services/turso_http_client.dart e turso_sync_service.dart.
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2

  # Bridge temporaneo verso Google Sheets (Admin > foglio "Copia di Spese",
  # v. CLAUDE.md): autenticazione service account, non OAuth interattivo
  # (google_sign_in non supporta Windows desktop). Pacchetti Dart puri
  # mantenuti da Google, nessuna toolchain nativa (stesso principio già
  # seguito per Turso).
  googleapis_auth: ^2.3.3
  googleapis: ^16.0.0

  # OCR offline scontrini
  google_mlkit_text_recognition: ^0.13.0
  camera: ^0.11.0
  image_picker: ^1.1.2

  # Grafici dashboard
  fl_chart: ^0.68.0

  # Import/Export CSV
  csv: ^6.0.0
  file_picker: ^8.0.0

  # Utility
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test double ufficiale di FlutterSecureStorage (v.
  # test/safe_transaction_deletion_service_test.dart): già una dipendenza
  # transitiva di flutter_secure_storage, dichiarata qui perché importata
  # direttamente nei test.
  flutter_secure_storage_platform_interface: ^1.1.2
  # StreamQueue (v. test/category_dao_test.dart): ordina in modo deterministico
  # le emissioni di uno stream nei test, senza `Future.delayed` a caso.
  async: ^2.11.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.20.0

  # Icona app (Android + Windows) e splash screen nativo Android: strumenti
  # dev-only, eseguiti a mano (`dart run flutter_launcher_icons` / `dart run
  # flutter_native_splash:create`) quando cambia assets/icon/*, non a ogni
  # build_runner.
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Font per gli importi in denaro (v. core/theme/app_theme.dart,
  # amountTextStyle). Aptos Display richiesto dall'utente non è liberamente
  # ridistribuibile (font proprietario Microsoft, non concesso in licenza per
  # l'embedding in app di terze parti): Public Sans è l'alternativa scelta,
  # stile analogo (grottesco umanista pulito) e licenza libera (OFL, v.
  # assets/fonts/PublicSans-LICENSE.md). Font variabile: un solo file copre
  # tutti i pesi.
  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf

# Icona app: carrello ambra/arancio con "T" su sfondo crema (stessi colori
# del tema, v. core/theme/app_theme.dart _brandSeedColor/_brandCream).
# tally_icon.png = versione completa (con sfondo), usata per Windows e come
# icona legacy Android. tally_icon_foreground.png = solo carrello (sfondo
# trasparente), usata per l'icona adattiva Android (API 26+) e per lo
# splash screen, composta a runtime su adaptive_icon_background/color.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/tally_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FAF0E0"
  adaptive_icon_foreground: "assets/icon/tally_icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon/tally_icon.png"
    icon_size: 256

flutter_native_splash:
  color: "#FAF0E0"
  image: assets/icon/tally_icon_foreground.png
  android_12:
    image: assets/icon/tally_icon_foreground.png
    color: "#FAF0E0"
  android: true
  ios: false
  web: false
