name: finance_app
description: >
  App per la gestione delle finanze personali - locale, offline-first,
  con sync multi-dispositivo su Turso (piano Free) e OCR scontrini offline.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Database locale
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Sync multi-dispositivo (Turso / libSQL) - piano Free
  # NOTA: rimosso temporaneamente. libsql_dart si appoggia a
  # flutter_rust_bridge/native_toolchain_rust, che richiede un toolchain Rust
  # (cargo) installato per compilare codice nativo ad ogni build, su
  # qualunque piattaforma target — anche se il pacchetto non viene ancora
  # usato da nessun file (v. data/services/sync_service.dart, solo
  # interfaccia astratta). Va reintrodotto all'inizio della Milestone M7,
  # quando implementeremo la sync vera e installeremo Rust apposta.
  # libsql_dart: ^0.9.0+0.9.30

  # OCR offline scontrini
  google_mlkit_text_recognition: ^0.13.0
  camera: ^0.11.0
  image_picker: ^1.1.2

  # Grafici dashboard
  fl_chart: ^0.68.0

  # Import/Export Excel/CSV
  excel: ^4.0.6
  csv: ^6.0.0
  file_picker: ^8.0.0
  share_plus: ^11.0.0

  # Utility
  intl: ^0.20.2
  uuid: ^4.4.0
  collection: ^1.18.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
