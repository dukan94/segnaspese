name: Analyze & Test

# Gira su ogni push, su qualunque branch: deve far emergere errori di
# analisi/test prima del merge, non dopo (importante anche per il lavoro da
# due PC in parallelo, v. CLAUDE.md "Come lavorare su questo progetto").
# Niente `pull_request:`: non si usano mai PR in questo repo (mono-sviluppatore).
#
# paths-ignore: un commit di soli file .md non tocca codice Flutter, non
# serve rigenerare/analizzare/testare nulla — non impedisce comunque il
# push (git e trigger CI sono indipendenti), salta solo la run inutile.
#
# concurrency: se si pusha due volte di fila sullo STESSO branch (es.
# iterando un fix), la run precedente ormai superata viene cancellata
# invece di girare fino in fondo per un risultato che il push successivo
# rimpiazza comunque. Raggruppato per branch (github.ref), non per repo:
# non interferisce tra branch diversi lavorati in parallelo dai due PC.
on:
  push:
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Rigenera i file *.g.dart (Drift/Riverpod): analyze/test altrimenti
      # falliscono su codice generato assente o disallineato.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test
