name: Build Android APK

# Compila un APK debug installabile su telefono, senza bisogno di Android
# Studio/SDK in locale (v. sviluppo su dispositivo aziendale senza SDK
# Android). Pubblicato su una release GitHub fissa (M46, 20 ago 2026), non
# più negli Artifacts della run: link di download stabile nel tempo, stesso
# principio già in uso per Windows (M37) —
# https://github.com/dukan94/segnaspese/releases/download/android-latest/Tally-Android.apk
# — installare/aggiornare su un nuovo dispositivo significa solo scaricare
# di nuovo questo link, senza dover trovare la run giusta nella tab Actions
# (che oltretutto teneva l'APK solo 3 giorni).
#
# Solo su richiesta manuale (tab Actions > "Build Android APK" > "Run
# workflow"), non più ad ogni push su main: era il workflow più costoso in
# minuti Actions (build APK completa da zero ogni volta) e ha contribuito
# a esaurire la quota gratuita mensile (2.000 min, 17 ago 2026) insieme a
# `ci.yml`, che invece resta automatico com'è (più leggero, vero controllo
# qualità). Va lanciato a mano solo quando serve davvero un APK aggiornato
# da installare sul telefono. Runner ubuntu-latest, 1x sul conteggio minuti
# (a differenza di un eventuale runner Windows, 2x) — costo per run
# invariato rispetto a prima, solo la destinazione della pubblicazione
# cambia.
on:
  workflow_dispatch:

# "contents: write" serve sia per ricommittare il keystore generato la
# prima volta (v. step "Genera e salva" sotto) sia per pubblicare/
# aggiornare la release fissa "android-latest" (nuovo, M46) con il
# GITHUB_TOKEN di default — nessun nuovo secret.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Ogni runner di GitHub Actions parte "pulito": senza un keystore di
      # debug stabile, il plugin Android ne genera uno NUOVO (casuale) a ogni
      # run, quindi ogni APK ha una firma diversa e Android rifiuta
      # l'aggiornamento in-place sul telefono ("pacchetto in conflitto", va
      # disinstallata la versione precedente). actions/cache si è rivelata
      # inaffidabile per questo (non sempre ripristinata prima della build):
      # il keystore è quindi un file vero, committato nel repo la prima volta
      # che questo workflow gira, poi sempre riusato invariato. android/app/
      # build.gradle.kts punta esplicitamente a questo file (v. signingConfigs).
      - name: Genera e salva il keystore di debug (una tantum)
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SegnaSpese Debug,O=Personal,C=IT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "Aggiungi keystore di debug persistente per CI [skip ci]"
            # checkout lascia HEAD "distaccato" sugli eventi push: bisogna
            # specificare il branch di destinazione esplicitamente.
            git push origin HEAD:main
          fi

      - run: flutter pub get

      # Rigenera i file *.g.dart (Drift/Riverpod): se qualcuno dimentica di
      # rilanciarlo dopo una modifica a schema/provider prima di committare,
      # la build fallisce qui invece che silenziosamente con codice generato
      # disallineato (v. nota "BUILD" in progettazione_finance_app.md).
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug

      # Pubblica su una release "rolling" a link fisso (M46, 20 ago 2026),
      # non più come Artifact della run: niente più consumo della quota
      # storage Artifacts (0.5GB gratis, già causa di un incidente il 5 ago
      # 2026) e niente più retention di 3 giorni da rincorrere — il link
      # resta valido finché non viene sostituito dalla prossima pubblicazione.
      # gh CLI è già preinstallata sui runner GitHub-hosted (a differenza del
      # PC aziendale di Mario, v. commento in cima al file): nessun nuovo
      # tool, autenticata automaticamente col GITHUB_TOKEN di default.
      - name: Pubblica su release fissa android-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk Tally-Android.apk
          NOTES="APK di debug, pubblicato automaticamente da CI. Ultimo aggiornamento: commit ${{ github.sha }}."
          if gh release view android-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload android-latest Tally-Android.apk --repo "${{ github.repository }}" --clobber
            gh release edit android-latest --repo "${{ github.repository }}" --notes "$NOTES"
          else
            gh release create android-latest Tally-Android.apk --repo "${{ github.repository }}" \
              --title "Tally per Android" --notes "$NOTES"
          fi
