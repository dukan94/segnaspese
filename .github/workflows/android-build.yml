name: Build Android APK

# Compila un APK debug installabile su telefono, senza bisogno di Android
# Studio/SDK in locale (v. sviluppo su dispositivo aziendale senza SDK
# Android). Scaricabile dalla tab "Actions" della run, sezione "Artifacts".
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Ogni runner di GitHub Actions parte "pulito": senza questo, il plugin
      # Android genera un keystore di debug NUOVO (casuale) a ogni run, quindi
      # ogni APK ha una firma diversa e Android rifiuta l'aggiornamento in-place
      # sul telefono ("pacchetto in conflitto", va disinstallata la versione
      # precedente). La cache mantiene lo stesso keystore tra una run e
      # l'altra: generato una sola volta, poi sempre riusato.
      - name: Cache keystore di debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Genera il keystore di debug se non esiste ancora
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SegnaSpese Debug,O=Personal,C=IT"
          fi

      - run: flutter pub get

      # Rigenera i file *.g.dart (Drift/Riverpod): se qualcuno dimentica di
      # rilanciarlo dopo una modifica a schema/provider prima di committare,
      # la build fallisce qui invece che silenziosamente con codice generato
      # disallineato (v. nota "BUILD" in progettazione_finance_app.md).
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: segnaspese-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
