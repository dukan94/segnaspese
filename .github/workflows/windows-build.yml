name: Build Windows App

# Compila la build desktop Windows e la pubblica su una release GitHub
# fissa, senza bisogno che Mario la ricompili/zippi/carichi a mano dal suo
# PC (M46, parte Windows, ripresa il 2 set 2026 dopo il reset della quota
# minuti Actions). Stesso link fisso già esistente da M37, solo la
# pubblicazione diventa automatica:
# https://github.com/dukan94/segnaspese/releases/download/windows-latest/Tally-Windows.zip
#
# COSTO IN MINUTI — runner windows-latest conta 2x sul totale mensile
# (2.000 min gratis/mese): una run qui costa quanto ~2 run equivalenti su
# ubuntu-latest. Per questo, a differenza di ci.yml:
# - Solo `workflow_dispatch` (mai su push): Mario lancia questo workflow
#   solo quando vuole davvero pubblicare una build aggiornata, non ad ogni
#   commit — stesso principio già seguito da android-build.yml.
# - Cache dei pacchetti pub (`actions/cache` sotto) tra una run e l'altra:
#   evita di riscaricare da zero le stesse dipendenze quando pubspec.lock
#   non cambia, per accorciare il tempo (quindi i minuti) di ogni run
#   successiva. Il cache della cache dell'SDK Flutter stesso lo fa già
#   `subosito/flutter-action` con `cache: true`.
# - Nessun `actions/upload-artifact`: si pubblica solo sulla release fissa
#   (storage Releases, separato e molto più ampio della quota Artifacts da
#   0.5GB già causa di un incidente passato, v. CLAUDE.md).
#
# M47 (2 set 2026): dopo la pubblicazione, il job "publish-version" separato
# aggiorna il numero di build corrente per Windows su version.json (GitHub
# Pages) — stesso meccanismo di android-build.yml. Job apposta su
# ubuntu-latest (1x sul conteggio minuti, non windows-latest): il solo
# aggiornamento del JSON non ha alcun bisogno di un runner Windows, farlo
# lì sprecherebbe minuti al doppio del costo per un'operazione che non
# tocca affatto la build Windows.
on:
  workflow_dispatch:

# Serve solo per pubblicare/aggiornare la release fissa "windows-latest"
# col GITHUB_TOKEN di default — nessun nuovo secret (stesso principio di
# android-build.yml). Il job "publish-version" sotto dichiara i propri
# permessi (pages/id-token), diversi da questi: un blocco `permissions` a
# livello di job sostituisce quello di default del workflow per quel job,
# non lo somma.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # PUB_CACHE esplicito (invece di affidarsi alla posizione di default
    # sotto %LOCALAPPDATA%): il contesto `env` delle espressioni GitHub
    # Actions espone SOLO le variabili dichiarate in un blocco `env:` del
    # workflow, non le variabili d'ambiente reali del runner Windows — un
    # primo tentativo con `${{ env.LOCALAPPDATA }}` nello step di cache
    # sotto risolveva quindi a stringa vuota (path `\Pub\Cache`, mai
    # coincidente con la cache pub reale): nessun errore visibile, la
    # cache era semplicemente sempre un no-op silenzioso, vanificando la
    # precauzione sui minuti che questo env esiste apposta a garantire.
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Cache dei pacchetti pub scaricati (non l'SDK Flutter, già gestito
      # sopra): invalidata solo quando pubspec.lock cambia, altrimenti
      # `flutter pub get` sotto riusa quanto già presente invece di
      # riscaricare tutto da zero ad ogni run.
      - name: Cache pacchetti pub
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-windows-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-windows-

      - run: flutter pub get

      # Rigenera i file *.g.dart (Drift/Riverpod): se qualcuno ha
      # dimenticato di rilanciarlo dopo una modifica a schema/provider
      # prima di committare, la build fallisce qui invece che silenziosamente
      # con codice generato disallineato (stesso principio di ci.yml/
      # android-build.yml). Deliberatamente MAI messo in cache: rigenerarlo
      # sempre da zero è l'unico modo per essere certi che rispecchi il
      # sorgente committato.
      - run: dart run build_runner build --delete-conflicting-outputs

      # --dart-define=BUILD_NUMBER (M47): stesso principio di
      # android-build.yml — github.run_number è un contatore monotono per
      # QUESTO workflow, confrontato in app col numero pubblicato su
      # version.json per mostrare il banner di aggiornamento.
      - run: flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }}

      # Stesso contenuto/percorso che Mario comprime a mano da M37: la
      # cartella build di Flutter è già portabile, non serve un installer
      # (v. CLAUDE.md "Distribuzione Windows").
      - name: Comprimi la build in zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Tally-Windows.zip -Force

      # gh CLI è già preinstallata sui runner GitHub-hosted (a differenza
      # del PC aziendale di Mario, v. CLAUDE.md "Distribuzione Windows").
      # Stesso pattern di android-build.yml: aggiorna la release esistente
      # se c'è già, altrimenti la crea la prima volta.
      - name: Pubblica su release fissa windows-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = "Build Windows, pubblicata automaticamente da CI. Ultimo aggiornamento: commit ${{ github.sha }}."
          gh release view windows-latest --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload windows-latest Tally-Windows.zip --repo "${{ github.repository }}" --clobber
            gh release edit windows-latest --repo "${{ github.repository }}" --notes "$notes"
          } else {
            gh release create windows-latest Tally-Windows.zip --repo "${{ github.repository }}" `
              --title "Tally per Windows" --notes "$notes"
          }

  # M47 (2 set 2026): pubblica il numero di build Windows corrente su un
  # piccolo version.json su GitHub Pages — stesso meccanismo del job
  # equivalente in android-build.yml (v. commento lì per il perché
  # GitHub Pages e per la necessità dell'attivazione una tantum da parte
  # di Mario). Runner ubuntu-latest (1x), non windows-latest: nessuna
  # dipendenza da qui in poi dal runner della build.
  publish-version:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Stesso nome di gruppo di android-build.yml: serializza l'ESECUZIONE
    # dei due job se capitano nello stesso momento (uno aspetta che l'altro
    # finisca). Non garantisce da sola che il `curl` sotto veda già il
    # deploy appena fatto dall'altro job: GitHub Pages è servito da una CDN
    # con un margine di propagazione, quindi resta un rischio residuo,
    # ridotto (non eliminato) dal cache-busting sull'URL sotto. Impatto
    # comunque basso e si autocorregge da solo alla pubblicazione
    # successiva della stessa piattaforma (v. `max` nello step sotto: mai
    # una regressione, nel peggiore dei casi una chiave temporaneamente non
    # aggiornata) — accettato per uso personale, non vale un meccanismo più
    # robusto (es. leggere l'ultimo deploy via API invece che da Pages).
    concurrency:
      group: pages-version-json
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `max` invece di un'assegnazione diretta: due dispatch ravvicinati
      # dello stesso workflow possono completare il job "build" (lento, su
      # windows-latest) in ordine invertito rispetto a quello di partenza
      # — senza questa guardia, la run più vecchia a finire per ultima
      # riscriverebbe un numero più BASSO sopra quello già pubblicato
      # dalla run più recente, facendo sparire il banner o mostrandolo con
      # un numero sbagliato finché non arriva un'altra pubblicazione.
      - name: Aggiorna version.json (chiave "windows")
        run: |
          mkdir -p dist
          curl -fsSL "https://dukan94.github.io/segnaspese/version.json?_=${{ github.run_id }}" -o current.json || echo '{}' > current.json
          jq --argjson n ${{ github.run_number }} '.windows = ([.windows // 0, $n] | max)' current.json > dist/version.json
          cat dist/version.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
