org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disattiva la compilazione incrementale di Kotlin: il progetto è su D: e la
# cache dei pacchetti (pub) è su C:, e il compilatore incrementale di Kotlin
# non riesce a calcolare percorsi relativi tra dischi diversi
# ("this and base files have different roots"), facendo fallire la build dei
# plugin (camera, image_picker, share_plus). Con la incrementale disattivata
# il problema sparisce (build leggermente più lenta, ma stabile).
kotlin.incremental=false
